name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar bibliotecas de sistema do Qt (GUI, modo offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install project (with dev + gui dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (--strict)
        run: mypy src

      - name: Pytest (com cobertura)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v --cov=openstruct --cov-report=term-missing
