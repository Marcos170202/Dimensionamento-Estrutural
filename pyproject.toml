[project]
name = "openstruct3d"
version = "0.12.0"
description = "OpenStruct 3D — nucleo de analise estrutural 3D + GUI desktop com viewport 3D (SOLVER V1 + NORMATIVE ENGINE + GUI V1)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scipy-stubs>=1.11",
]
gui = [
    "PySide6>=6.5",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]
build = [
    "pyinstaller>=6.0",
]

[project.gui-scripts]
openstruct3d-gui = "openstruct.gui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["openstruct"]
mypy_path = ["src"]
